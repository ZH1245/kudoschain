syntax = "proto3";
package kudoschain.kudos.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "kudoschain/x/kudos/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "kudoschain/x/kudos/Params";
  option (gogoproto.equal) = true;
}

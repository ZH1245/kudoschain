syntax = "proto3";

package kudoschain.bounty.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "kudoschain/bounty/v1/bounty.proto";
import "kudoschain/bounty/v1/params.proto";

option go_package = "kudoschain/x/bounty/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/kudoschain/bounty/v1/params";
  }

  // ShowBounty Queries a list of ShowBounty items.
  rpc ShowBounty(QueryShowBountyRequest) returns (QueryShowBountyResponse) {
    option (google.api.http).get = "/kudoschain/bounty/v1/show_bounty/{id}";
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryShowBountyRequest defines the QueryShowBountyRequest message.
message QueryShowBountyRequest {
  uint64 id = 1;
}

// QueryShowBountyResponse defines the QueryShowBountyResponse message.
message QueryShowBountyResponse {
  Bounty bounty = 1;
}
